<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050608">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="BJJ drills and sparring timer for Jiu-Jitsu training, offline-first on iOS and Android.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Awaken Drills">
  <title>BJJ Drills - Awaken Drills</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="shortcut icon" href="/assets/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.mjs"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/">
      <img id="brandLogo" src="/assets/logo.png" alt="Awaken Bright Side of Jiu Jitsu" width="44" height="44">
      <span>Awaken <strong>Drills</strong></span>
    </a>
    <button class="icon-button" id="settingsToggle" type="button" aria-label="Configurações">⚙</button>
    <section class="settings-menu" id="settingsMenu" hidden>
      <div class="settings-title-row"><div><h2 data-i18n="settings">Configurações</h2><span data-i18n="generalPreferences">Preferências gerais</span></div><span class="version-badge">v5.4.2</span></div>
      <div class="settings-row"><span><strong data-i18n="language">Idioma</strong><small>PT / EN</small></span><div class="language-toggle"><button id="langPT" data-lang="pt-BR">PT</button><button id="langEN" data-lang="en">EN</button></div></div>
      <label class="settings-row switch-row"><span><strong data-i18n="sound">Som</strong><small data-i18n="bellsAndAlerts">Sinos e alertas</small></span><input id="audioEnabled" type="checkbox" checked><i></i></label>
      <label class="settings-row"><span><strong data-i18n="bell">Sino</strong><small data-i18n="bellHelp">Som ao trocar ou finalizar</small></span><select id="bellType"><option value="boxing">Boxing Bell</option><option value="smash">I'm gonna smash your boy</option><option value="faaah">Faaah</option><option value="fart">Dry Fart</option><option value="ring">Ringue clássico</option><option value="double">Ringue duplo</option><option value="vintage">Ringue vintage</option></select></label>
      <button class="settings-action" id="previewBell" type="button" data-i18n="previewBell">Ouvir sino</button>
      <label class="settings-row switch-row"><span><strong data-i18n="finalCountdown">Contagem final</strong><small data-i18n="finalCountdownHelp">Bipes em 3, 2 e 1 segundos</small></span><input id="countdownBeeps" type="checkbox" checked><i></i></label>
      <label class="settings-row switch-row"><span><strong data-i18n="keepAwake">Manter tela ativa</strong><small data-i18n="keepAwakeHelp">Durante cronômetros em execução</small></span><input id="wakeLockEnabled" type="checkbox" checked><i></i></label>
      <button class="settings-danger" id="restoreDefaults" type="button" data-i18n="restoreDefaults">Restaurar padrões</button>
    </section>
  </header>

  <main class="app-shell">
    <section class="mode-switch"><button class="mode-button is-active" data-mode="drill">Drill</button><button class="mode-button" data-mode="sparring">Sparring</button><button class="mode-button" data-mode="infinite">∞</button></section>

    <section id="drillSetup" class="mode-panel">
      <div class="hero-copy"><p class="eyebrow">JIU-JITSU TIMER</p><h1 data-i18n="drillsTitle">Drills</h1></div>
      <div class="card compact-grid">
        <label class="field"><span data-i18n="athletes">Atletas</span><select id="athleteCount"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
        <label class="field"><span data-i18n="setsPerAthlete">Séries por atleta</span><select id="drillSets"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10</option></select></label>
        <label class="field"><span data-i18n="prepare">Preparar</span><select id="drillPrep"><option value="0">0 s</option><option value="3">3 s</option><option value="5" selected>5 s</option><option value="10">10 s</option><option value="15">15 s</option><option value="20">20 s</option><option value="30">30 s</option></select></label>
        <div class="field"><span data-i18n="drillTime">Tempo do drill</span><div class="time-inputs"><input id="drillMinutes" type="number" min="0" max="60" value="1"><b>:</b><input id="drillSeconds" type="number" min="0" max="59" value="0"></div></div>
      </div>
      <div class="section-title"><h2 data-i18n="athletes">Atletas</h2><span data-i18n="colorIsBackground">Cor = fundo do cronômetro</span></div>
      <div class="athletes" id="athletesContainer"></div>
      <button class="primary-button" id="startDrill" type="button" data-i18n="startDrill">Iniciar drill</button>
    </section>

    <section id="sparringSetup" class="mode-panel" hidden>
      <div class="hero-copy"><p class="eyebrow">SPARRING TIMER</p><h1 data-i18n="roundsTitle">Rounds</h1></div>
      <div class="card compact-grid">
        <label class="field"><span data-i18n="rounds">Rounds</span><select id="sparringRounds"><option>1</option><option>2</option><option>3</option><option selected>5</option><option>6</option><option>8</option><option>10</option></select></label>
        <label class="field"><span data-i18n="prepare">Preparar</span><select id="sparringPrep"><option value="0">0 s</option><option value="5">5 s</option><option value="10" selected>10 s</option><option value="15">15 s</option><option value="30">30 s</option></select></label>
        <div class="field"><span data-i18n="round">Round</span><div class="time-inputs"><input id="sparringMinutes" type="number" min="0" max="60" value="5"><b>:</b><input id="sparringSeconds" type="number" min="0" max="59" value="0"></div></div>
        <div class="field"><span data-i18n="rest">Descanso</span><div class="time-inputs"><input id="restMinutes" type="number" min="0" max="30" value="1"><b>:</b><input id="restSeconds" type="number" min="0" max="59" value="0"></div></div>
      </div>
      <button class="primary-button" id="startSparring" type="button" data-i18n="startSparring">Iniciar sparring</button>
    </section>

    <section id="infiniteSetup" class="mode-panel" hidden>
      <div class="hero-copy"><p class="eyebrow">OPEN TIMER</p><h1 data-i18n="infiniteTitle">Contagem infinita</h1></div>
      <div class="card infinite-card"><p data-i18n="infiniteHelp">Cronômetro crescente sem limite de tempo.</p></div>
      <button class="primary-button" id="startInfinite" type="button" data-i18n="startInfinite">Iniciar contagem</button>
    </section>
  </main>

  <section class="timer-screen" id="timerScreen" hidden>
    <div class="timer-top timer-chrome">
      <button class="timer-icon" id="backButton" type="button" aria-label="Voltar">←</button>
      <div class="phase-meta"><span id="phaseLabel"></span><small id="phaseProgress"></small></div>
      <button class="timer-icon" id="fullscreenButton" type="button" aria-label="Tela cheia">⛶</button>
    </div>

    <div class="timer-center" id="timerCenter">
      <div class="athlete-name" id="timerAthlete"></div>
      <div class="clock" id="clock">00:00</div>
      <div class="current-technique" id="currentTechnique"></div>
    </div>

    <div class="technique-cue" id="techniqueCue" hidden aria-live="assertive">
      <span class="technique-athlete" id="techniqueAthlete"></span>
      <small data-i18n="nextTechnique">TÉCNICA</small>
      <strong id="techniqueText"></strong>
    </div>

    <div class="timer-bottom timer-chrome">
      <div class="phase-bar"><span id="phaseBarFill"></span></div>
      <div class="timer-controls">
        <button class="timer-icon" id="previousPhase" type="button" aria-label="Anterior">‹</button>
        <button class="play-button" id="playPause" type="button">Iniciar</button>
        <button class="timer-icon" id="nextPhase" type="button" aria-label="Próximo">›</button>
      </div>
      <button class="reset-button" id="resetTimer" type="button" data-i18n="resetSession">Reiniciar sessão</button>
    </div>
  </section>

  <div class="toast" id="toast" hidden role="status"></div>
  <div class="sr-only" id="announcement" aria-live="polite"></div>
</body>
</html>
